<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Náhled rebrand bannerů VZV</title>
  <link href="https://fonts.googleapis.com/css2?family=Tasa+Orbiter:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --lime: #73FB61;
      --green-900: #073201;
      --green-800: #0E6303;
      --black: #000000;
      --ink: #111111;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Tasa Orbiter", Montserrat, sans-serif;
      background: #111;
      color: #ddd;
      padding: 32px 24px 80px;
    }
    body.shot { background: #000; padding: 0; }
    body.shot .page { display: none !important; }
    .page { max-width: 1120px; margin: 0 auto 28px; }
    .page .kicker {
      color: var(--lime);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    .page h1 { margin: 0 0 8px; font-size: 22px; color: #fff; }
    .page p { margin: 0; color: #9a9a9a; font-size: 14px; }
    h2.sec {
      max-width: 1120px;
      margin: 36px auto 12px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--lime);
    }
    .stage { margin: 0 auto 8px; }
    .stage.web { width: 870px; }
    .stage.social { width: 1080px; }

    .label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8d8d8d;
    }
    .label.now { color: var(--lime); }

    /* —— 870 × 580 web —— */
    .banner-web {
      position: relative;
      width: 870px;
      height: 580px;
      overflow: hidden;
      background: var(--black);
      display: grid;
      grid-template-columns: 1fr 280px;
    }
    .banner-web .copy {
      padding: 40px 40px 36px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .banner-web .was {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
    }
    .banner-web .old {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .banner-web .old img {
      height: 52px;
      width: auto;
      display: block;
    }
    .banner-web .hero {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding-bottom: 8px;
    }
    .banner-web .logo-now {
      width: 430px;
      max-width: 100%;
      height: auto;
      display: block;
    }
    .banner-web .claim {
      width: 280px;
      height: auto;
      display: block;
    }
    .banner-web .pattern {
      background-color: #000;
      background-image: url("pattern.png");
      background-repeat: repeat-x;
      background-size: auto 100%;
      background-position: center;
      border-left: 4px solid var(--lime);
    }

    /* —— 1080 × 1080 social —— */
    .banner-social {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: var(--black);
      display: flex;
      flex-direction: column;
    }
    .banner-social .rail {
      height: 220px;
      background-color: #000;
      background-image: url("pattern.png");
      background-repeat: repeat-x;
      background-size: auto 100%;
      background-position: center;
      flex: 0 0 220px;
    }
    .banner-social .mid {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding: 40px 72px 24px;
    }
    .banner-social .logo-now {
      width: 760px;
      height: auto;
      display: block;
    }
    .banner-social .claim {
      width: 420px;
      height: auto;
      display: block;
    }
    .banner-social .was {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 0 0 48px;
    }
    .banner-social .old {
      display: flex;
      gap: 10px;
    }
    .banner-social .old img {
      height: 64px;
      width: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="page">
    <p class="kicker">VZV · rebrand</p>
    <h1>Bannery k novému logu a claimu</h1>
    <p>870×580 pro web (homepage slot) a 1080×1080 pro sociální sítě. Staré loga, nové VZV, VEZEME VOZÍKY a vidlicový pattern.</p>
  </div>

  <h2 class="sec">Web 870 × 580</h2>
  <div class="stage web">
    <section class="banner-web" id="banner-web">
      <div class="copy">
        <div class="was">
          <span class="label">Dříve</span>
          <div class="old">
            <img src="logo-old-red.png" alt="VZV.cz">
            <img src="logo-old-yellow.png" alt="VZVRENT.cz">
          </div>
        </div>
        <div class="hero">
          <span class="label now">Nyní</span>
          <img class="logo-now" src="logo-vzv.png" alt="VZV">
          <img class="claim" src="claim-white.png" alt="Vezeme vozíky">
        </div>
      </div>
      <div class="pattern" aria-hidden="true"></div>
    </section>
  </div>

  <h2 class="sec">Sociální sítě 1080 × 1080</h2>
  <div class="stage social">
    <section class="banner-social" id="banner-social">
      <div class="rail" aria-hidden="true"></div>
      <div class="mid">
        <span class="label now">Nová tvář VZV</span>
        <img class="logo-now" src="logo-vzv.png" alt="VZV">
        <img class="claim" src="claim-white.png" alt="Vezeme vozíky">
      </div>
      <div class="was">
        <span class="label">Dříve VZV.cz a VZVRENT.cz</span>
        <div class="old">
          <img src="logo-old-red.png" alt="VZV.cz">
          <img src="logo-old-yellow.png" alt="VZVRENT.cz">
        </div>
      </div>
      <div class="rail" aria-hidden="true"></div>
    </section>
  </div>
</body>
</html>
